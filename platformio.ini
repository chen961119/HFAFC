; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = teensy41

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
extra_scripts = post:tools/teensy_debug/configure_vscode.py
build_src_filter = +<*>
build_flags = 
	-D USB_SERIAL
	-O3
	-ffast-math
	-w
upload_protocol = teensy-gui
monitor_speed = 921600
monitor_filters = 
	colorize
	time
lib_deps = 
	hideakitai/ArduinoEigen@^0.3.2
	mikalhart/TinyGPSPlus@^1.1.0
	finani/ICM42688@^1.1.0
	bolderflight/Bolder Flight Systems BMI088@^1.0.1

; 板上断点调试：一根 USB 线枚举两个串口，Serial 用于地面站，SerialUSB1 用于 GDB。
[env:teensy41_debug]
extends = env:teensy41
build_type = debug
build_unflags = -O3 -Os -ffast-math -DUSB_SERIAL
build_flags = -DUSB_DUAL_SERIAL -DCOFLY_TEENSY_DEBUG -DGDB_MANUAL_SELECTION -w
debug_build_flags = -O2 -g3
extra_scripts = pre:tools/teensy_debug/build_flags.py, post:tools/teensy_debug/configure_vscode.py
lib_deps =
    ${env:teensy41.lib_deps}
    TeensyDebug=file://tools/teensy_debug/vendor/TeensyDebug
